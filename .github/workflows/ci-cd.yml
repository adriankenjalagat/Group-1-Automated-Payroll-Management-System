name: CI/CD Pipeline (Build, Test & Docker)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io

jobs:
  backend-ci:
    name: Backend CI (Build, Migrate & Smoke Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Group-1-Automated-Payroll-Management-System
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d Group-1-Automated-Payroll-Management-System"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci

      - name: Build backend (TypeScript + SQL assets)
        run: npm run build

      - name: Run PostgreSQL schema & migrations
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: Group-1-Automated-Payroll-Management-System
          DB_USER: postgres
          DB_PASSWORD: ci_postgres_password
          JWT_SECRET: ci_test_jwt_secret_key_for_payroll_2026_secure
        run: npx tsx src/config/migrate.ts

      - name: Smoke test compiled server (/api/health & /api/auth/login)
        env:
          PORT: "3000"
          NODE_ENV: production
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: Group-1-Automated-Payroll-Management-System
          DB_USER: postgres
          DB_PASSWORD: ci_postgres_password
          JWT_SECRET: ci_test_jwt_secret_key_for_payroll_2026_secure
        run: |
          node dist/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then
              echo ""
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000/api/health | grep -q '"status":"online"'

          LOGIN_RESP=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"identifier":"rbautista","password":"rbautista"}')
          echo "$LOGIN_RESP" | grep -q '"token"'
          echo "Backend smoke test passed."

  frontend-ci:
    name: Frontend CI (Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint (non-blocking report)
        continue-on-error: true
        run: npm run lint

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

  docker-build-and-push:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
